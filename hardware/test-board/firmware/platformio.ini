; LMN-3 Hall-effect key test - Teensy 4.1
; Build + upload: pio run -t upload   (or open LMN_HE_test/LMN_HE_test.ino in Arduino IDE + Teensyduino,
;                                       Tools > USB Type: "Serial + MIDI")
[platformio]
src_dir = LMN_HE_test

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DUSB_MIDI_SERIAL
monitor_speed = 115200
