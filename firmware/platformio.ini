; LMN-3 v3 (rev C) firmware - Teensy 4.1
; Build + upload:  pio run -t upload      (or open this folder in VS Code with the PlatformIO extension)
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; same USB type as the original LMN-3 firmware ("Teensy MIDI"); Serial still works in the Teensy serial monitor
build_flags = -DUSB_MIDI
; Encoder, WS2812Serial and EEPROM ship with the Teensy platform
